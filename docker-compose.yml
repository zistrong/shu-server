services:
  mongo:
    image: mongo:7
    container_name: shufang-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"          # 如需从宿主机直接连库，保留此行；不需要可删
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: shufang-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      PORT: "8000"
      # 微信开放平台扫码登录（可选）：填入后重启容器即启用，详见 README
      # WECHAT_APPID: ""
      # WECHAT_SECRET: ""
      # WECHAT_REDIRECT_URI: ""
    ports:
      - "8000:8000"
    volumes:
      - .:/app                         # 应用代码目录（改动即时生效）
      - ../shu/cn:/app/books/cn:ro         # 中文图书
      - ../shu/en:/app/books/en:ro         # 英文图书
      - ../shu/yi:/app/books/yi:ro         # 翻译图书

volumes:
  mongo-data:
